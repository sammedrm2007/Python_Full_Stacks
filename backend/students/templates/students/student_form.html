
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            background: #050510;
            color: white;
            overflow-x: hidden;
        }

        /* Neon Background */
        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #8a2be2;
            filter: blur(180px);
            opacity: 0.25;
            top: -150px;
            left: -100px;
            animation: glowMove 8s infinite alternate;
        }

        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #00eaff;
            filter: blur(180px);
            opacity: 0.2;
            bottom: -150px;
            right: -100px;
            animation: glowMove 8s infinite alternate-reverse;
        }

        @keyframes glowMove {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(100px, 80px);
            }
        }

        /* Registration Card */
        .register-box {
            position: relative;
            z-index: 2;
            width: 450px;
            padding: 35px;
            background: rgba(10, 10, 30, 0.95);
            border: 1px solid #00eaff;
            border-radius: 15px;

            box-shadow:
                0 0 10px #00eaff,
                0 0 30px rgba(0,234,255,0.4),
                inset 0 0 15px rgba(0,234,255,0.1);

            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            text-align: center;
            color: #00eaff;
            font-size: 26px;
            margin-bottom: 30px;
            text-shadow: 0 0 12px #00eaff;
            letter-spacing: 2px;
        }

        /* Django Form Fields */
        .register-box p {
            margin-bottom: 18px;
        }

        .register-box label {
            display: block;
            margin-bottom: 8px;
            color: #ff4fd8;
            font-size: 14px;
        }

        .register-box input,
        .register-box select,
        .register-box textarea {
            width: 100%;
            padding: 12px;
            background: #111127;
            color: white;
            border: 1px solid #44446a;
            border-radius: 7px;
            outline: none;
            transition: 0.3s;
        }

        .register-box input:focus,
        .register-box select:focus,
        .register-box textarea:focus {
            border-color: #00eaff;
            box-shadow: 0 0 12px #00eaff;
        }

        .register-box input::placeholder {
            color: #8888a8;
        }

        .register-box ul {
            color: #ff4f70;
            font-size: 12px;
            margin: 8px 0 0 20px;
        }

        .helptext {
            display: block;
            color: #aaaacc;
            font-size: 11px;
            margin-top: 6px;
        }

        /* Register Button */
        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: transparent;
            color: #00eaff;
            border: 1px solid #00eaff;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.4s;
        }

        button:hover {
            background: #00eaff;
            color: #050510;
            box-shadow:
                0 0 10px #00eaff,
                0 0 30px #00eaff;
            transform: translateY(-3px);
        }

        /* Mobile Responsive */
        @media(max-width: 500px) {
            .register-box {
                width: 100%;
                padding: 25px;
            }
        }

        /* Reduced Motion */
        @media(prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h2>STUDENT REGISTRATION</h2>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">REGISTER</button>
        </form>

    </div>

</body>
</html>
