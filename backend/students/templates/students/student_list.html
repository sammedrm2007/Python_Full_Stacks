
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registered Students</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            background: #050510;
            color: white;
            overflow-x: hidden;
        }

        /* Neon Background */
        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #8a2be2;
            filter: blur(180px);
            opacity: 0.25;
            top: -150px;
            left: -100px;
            animation: glowMove 8s infinite alternate;
        }

        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #00eaff;
            filter: blur(180px);
            opacity: 0.2;
            bottom: -150px;
            right: -100px;
            animation: glowMove 8s infinite alternate-reverse;
        }

        @keyframes glowMove {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(100px, 80px);
            }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 2;
            width: 950px;
            max-width: 100%;
            padding: 35px;
            background: rgba(10, 10, 30, 0.95);
            border: 1px solid #00eaff;
            border-radius: 15px;

            box-shadow:
                0 0 10px #00eaff,
                0 0 30px rgba(0,234,255,0.4),
                inset 0 0 15px rgba(0,234,255,0.1);

            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            text-align: center;
            color: #00eaff;
            font-size: 28px;
            margin-bottom: 30px;
            text-shadow: 0 0 12px #00eaff;
            letter-spacing: 2px;
        }

        /* Table */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #00eaff;
        }

        th {
            padding: 16px;
            color: #ff4fd8;
            background: #15152f;
            border: 1px solid #00eaff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 8px #ff4fd8;
        }

        td {
            padding: 15px;
            text-align: center;
            color: #dce6ff;
            border: 1px solid #44446a;
        }

        tr {
            transition: 0.3s;
        }

        tbody tr:hover {
            background: rgba(0,234,255,0.12);
            box-shadow: inset 0 0 15px rgba(0,234,255,0.15);
        }

        /* Empty Message */
        .empty {
            color: #ff4fd8;
            text-align: center;
            padding: 25px;
            text-shadow: 0 0 8px #ff4fd8;
        }

        /* Mobile Responsive */
        @media(max-width: 600px) {
            .container {
                padding: 20px;
            }

            h2 {
                font-size: 21px;
            }

            th, td {
                padding: 11px;
                font-size: 13px;
                white-space: nowrap;
            }
        }

        /* Reduced Motion */
        @media(prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <h2>REGISTERED STUDENTS</h2>

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Age</th>
                        <th>Department</th>
                    </tr>
                </thead>

                <tbody>

                    {% for student in students %}

                    <tr>
                        <td>{{ student.name }}</td>
                        <td>{{ student.email }}</td>
                        <td>{{ student.age }}</td>
                        <td>{{ student.department }}</td>
                    </tr>

                    {% empty %}

                    <tr>
                        <td colspan="4" class="empty">
                            No Students Found
                        </td>
                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</body>
</html>
