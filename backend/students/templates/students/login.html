
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Student Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050510;
            overflow: hidden;
            color: white;
        }

        /* Neon Background */
        body::before {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            background: #8a2be2;
            filter: blur(180px);
            opacity: 0.25;
            top: -200px;
            left: -150px;
            animation: moveGlow 8s infinite alternate;
        }

        body::after {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: #00eaff;
            filter: blur(180px);
            opacity: 0.2;
            bottom: -200px;
            right: -100px;
            animation: moveGlow 8s infinite alternate-reverse;
        }

        @keyframes moveGlow {
            from { transform: translate(0, 0); }
            to { transform: translate(100px, 80px); }
        }

        /* Login Card */
        .login-box {
            position: relative;
            z-index: 2;
            width: 380px;
            padding: 40px;
            background: rgba(10, 10, 30, 0.9);
            border: 1px solid #00eaff;
            border-radius: 15px;
            box-shadow:
                0 0 10px #00eaff,
                0 0 30px rgba(0,234,255,0.4),
                inset 0 0 15px rgba(0,234,255,0.1);
            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            text-align: center;
            color: #00eaff;
            font-size: 28px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #00eaff;
            letter-spacing: 2px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ff4fd8;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 22px;
            background: #111127;
            color: white;
            border: 1px solid #44446a;
            border-radius: 7px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #00eaff;
            box-shadow: 0 0 12px #00eaff;
        }

        input::placeholder {
            color: #8888a8;
        }

        button {
            width: 100%;
            padding: 13px;
            background: transparent;
            color: #00eaff;
            border: 1px solid #00eaff;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.4s;
        }

        button:hover {
            background: #00eaff;
            color: #050510;
            box-shadow: 0 0 10px #00eaff,
                        0 0 30px #00eaff;
            transform: translateY(-3px);
        }

        .error {
            color: #ff4f70;
            text-align: center;
            margin-bottom: 18px;
            text-shadow: 0 0 8px #ff4f70;
        }

        @media(max-width: 450px) {
            .login-box {
                width: 90%;
                padding: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>STUDENT LOGIN</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>USERNAME</label>
            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   required>

            <label>PASSWORD</label>
            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">LOGIN</button>
        </form>

    </div>

</body>
</html>
