<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Student Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050510;
            overflow: hidden;
            color: white;
        }

        /* Animated Neon Background */
        body::before {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            background: #8a2be2;
            filter: blur(180px);
            opacity: 0.25;
            top: -200px;
            left: -150px;
            animation: glowMove 8s infinite alternate;
        }

        body::after {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: #00eaff;
            filter: blur(180px);
            opacity: 0.2;
            bottom: -200px;
            right: -100px;
            animation: glowMove 8s infinite alternate-reverse;
        }

        @keyframes glowMove {
            from { transform: translate(0, 0); }
            to { transform: translate(100px, 80px); }
        }

        /* Dashboard Card */
        .dashboard {
            position: relative;
            z-index: 2;
            width: 400px;
            padding: 45px;
            text-align: center;
            background: rgba(10, 10, 30, 0.9);
            border: 1px solid #00eaff;
            border-radius: 15px;
            box-shadow:
                0 0 10px #00eaff,
                0 0 30px rgba(0,234,255,0.4),
                inset 0 0 15px rgba(0,234,255,0.1);
            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h2 {
            color: #00eaff;
            font-size: 28px;
            margin-bottom: 22px;
            text-shadow: 0 0 12px #00eaff;
            letter-spacing: 2px;
        }

        .username {
            color: #ff4fd8;
            font-size: 26px;
            margin-bottom: 25px;
            text-shadow: 0 0 12px #ff4fd8;
            animation: textGlow 2s infinite alternate;
        }

        @keyframes textGlow {
            from { text-shadow: 0 0 5px #ff4fd8; }
            to { text-shadow: 0 0 20px #ff4fd8; }
        }

        p {
            color: #b8c5d6;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        button {
            width: 100%;
            padding: 13px;
            background: transparent;
            color: #ff4fd8;
            border: 1px solid #ff4fd8;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
            transition: 0.4s;
        }

        button:hover {
            background: #ff4fd8;
            color: #050510;
            box-shadow: 0 0 10px #ff4fd8,
                        0 0 30px #ff4fd8;
            transform: translateY(-4px);
        }

        @media(max-width: 450px) {
            .dashboard {
                width: 90%;
                padding: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <h2>WELCOME!</h2>

        <h2 class="username">{{ user.username }}</h2>

        <p>
            Welcome to your Student Dashboard.<br>
            Your learning journey starts here!
        </p>

        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">LOGOUT</button>
        </form>

    </div>

</body>
</html>
